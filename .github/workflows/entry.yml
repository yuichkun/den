name: Entry gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  entry:
    name: entry
    runs-on: ubuntu-latest
    # PR36's final run took22m04s. The new spectral/IR/loop focused and
    # packed/browser gates add about2-3minutes of measured work. Only this
    # aggregate job budget changes; every test/audio/runtime threshold remains.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entry-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/playground/
            artifacts/integration/**/manifest.json
  catalog-smoke:
    name: catalog-smoke
    runs-on: ubuntu-latest
    # Reuse the exact packed-site/lifecycle gate for early feedback while the
    # unchanged full entry suite runs. This is additional, not a replacement.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run check
      - run: node --test --test-concurrency=1 tests/catalog-audition.test.mjs
      - name: Verify canonical catalog gate actually completed
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readdirSync, readFileSync } from 'node:fs';
          const root = 'artifacts/catalog-audition';
          const manifests = readdirSync(root).map(dir => JSON.parse(readFileSync(`${root}/${dir}/manifest.json`, 'utf8')));
          assert.equal(manifests.length, 1);
          const result = manifests[0];
          assert.equal(result.sourceCommit, process.env.EXPECTED_HEAD);
          assert.equal(result.sourceDirty, false);
          assert.equal(result.failure, undefined);
          assert.equal(result.rows.length, 8);
          assert(result.checks.some(check => typeof check === 'object' && check.check === 'trusted native touch target/identity sequence'));
          assert(result.checks.some(check => typeof check === 'string' && check.startsWith('eight A/B actual stereo auditions')));
          console.log('Canonical catalog gate completed: eight A/B rows and native touch/lifecycle evidence on exact head.');
          NODE
      - name: Run canonical native capture and freeze restore gate
        run: node --test --test-concurrency=1 tests/capture-freeze-browser.test.mjs
      - name: Verify native restore gate actually completed
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readdirSync, readFileSync } from 'node:fs';
          const root = 'artifacts/capture-freeze-browser';
          const manifests = readdirSync(root).map(dir => JSON.parse(readFileSync(`${root}/${dir}/manifest.json`, 'utf8')));
          assert.equal(manifests.length, 1);
          const result = manifests[0];
          assert.equal(result.sourceCommit, process.env.EXPECTED_HEAD);
          assert.equal(result.sourceDirty, false);
          assert.equal(result.failure, undefined);
          for (const check of ['types', 'offline', 'nativeRestore', 'build', 'browser']) assert.equal(result.checks[check], 'PASS');
          console.log('Canonical native capture/freeze restore gate completed on exact clean head.');
          NODE
      - name: Run canonical transition and expression browser gate
        run: node --test --test-concurrency=1 tests/transitions-browser.test.mjs
      - name: Verify transition restore gate actually completed
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readdirSync, readFileSync } from 'node:fs';
          const root = 'artifacts/transitions-browser';
          const manifests = readdirSync(root).map(dir => JSON.parse(readFileSync(`${root}/${dir}/manifest.json`, 'utf8')));
          assert.equal(manifests.length, 1);
          const result = manifests[0];
          assert.equal(result.sourceCommit, process.env.EXPECTED_HEAD);
          assert.equal(result.sourceDirty, false);
          assert.equal(result.failure, undefined);
          for (const check of ['types', 'offline', 'nativeRestore', 'build', 'browser']) assert.equal(result.checks[check], 'PASS');
          console.log('Canonical transition/expression gate completed on exact clean head.');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/catalog-audition/
            artifacts/capture-freeze-browser/
            artifacts/transitions-browser/

  playground-preview:
    name: playground-preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install --with-deps chromium
      - name: Verify packed editor and native two-example lifecycle
        env:
          DEN_PLAYGROUND_SCOPE: smoke
          NODE_OPTIONS: --max-old-space-size=1536
        run: node --test --test-concurrency=1 tests/site.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/playground/
