name: Entry gate
on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to verify for a release
        type: string
        required: true
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  entry:
    name: entry
    runs-on: ubuntu-latest
    # Main 3548edf7 completed in 28m30s before the new all54 playground gate.
    # c60cfac0 passed all76 Node tests at 29m46s, then the 30m job cap cut off
    # the trailing realtime captures. Allow aggregate headroom only; all test
    # timeouts, PCM/underrun assertions, commands and completion gates stay fixed.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entry-candidate-${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-ui-${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/playground/
            artifacts/integration/**/manifest.json
  catalog-smoke:
    name: catalog-smoke
    runs-on: ubuntu-latest
    # Reuse the exact packed-site/lifecycle gate for early feedback while the
    # unchanged full entry suite runs. This is additional, not a replacement.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run check
      - run: node --test --test-concurrency=1 tests/catalog-audition.test.mjs
      - name: Verify canonical catalog gate actually completed
        env:
          EXPECTED_HEAD: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readdirSync, readFileSync } from 'node:fs';
          const root = 'artifacts/catalog-audition';
          const manifests = readdirSync(root).map(dir => JSON.parse(readFileSync(`${root}/${dir}/manifest.json`, 'utf8')));
          assert.equal(manifests.length, 1);
          const result = manifests[0];
          assert.equal(result.sourceCommit, process.env.EXPECTED_HEAD);
          assert.equal(result.sourceDirty, false);
          assert.equal(result.failure, undefined);
          assert.equal(result.rows.length, 8);
          assert(result.checks.some(check => typeof check === 'object' && check.check === 'trusted native touch target/identity sequence'));
          assert(result.checks.some(check => typeof check === 'string' && check.startsWith('eight A/B actual stereo auditions')));
          console.log('Canonical catalog gate completed: eight A/B rows and native touch/lifecycle evidence on exact head.');
          NODE
      - name: Run canonical native capture and freeze restore gate
        run: node --test --test-concurrency=1 tests/capture-freeze-browser.test.mjs
      - name: Verify native restore gate actually completed
        env:
          EXPECTED_HEAD: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readdirSync, readFileSync } from 'node:fs';
          const root = 'artifacts/capture-freeze-browser';
          const manifests = readdirSync(root).map(dir => JSON.parse(readFileSync(`${root}/${dir}/manifest.json`, 'utf8')));
          assert.equal(manifests.length, 1);
          const result = manifests[0];
          assert.equal(result.sourceCommit, process.env.EXPECTED_HEAD);
          assert.equal(result.sourceDirty, false);
          assert.equal(result.failure, undefined);
          for (const check of ['types', 'offline', 'nativeRestore', 'build', 'browser']) assert.equal(result.checks[check], 'PASS');
          console.log('Canonical native capture/freeze restore gate completed on exact clean head.');
          NODE
      - name: Run canonical transition and expression browser gate
        run: node --test --test-concurrency=1 tests/transitions-browser.test.mjs
      - name: Verify transition restore gate actually completed
        env:
          EXPECTED_HEAD: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readdirSync, readFileSync } from 'node:fs';
          const root = 'artifacts/transitions-browser';
          const manifests = readdirSync(root).map(dir => JSON.parse(readFileSync(`${root}/${dir}/manifest.json`, 'utf8')));
          assert.equal(manifests.length, 1);
          const result = manifests[0];
          assert.equal(result.sourceCommit, process.env.EXPECTED_HEAD);
          assert.equal(result.sourceDirty, false);
          assert.equal(result.failure, undefined);
          for (const check of ['types', 'offline', 'nativeRestore', 'build', 'browser']) assert.equal(result.checks[check], 'PASS');
          console.log('Canonical transition/expression gate completed on exact clean head.');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-smoke-${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/catalog-audition/
            artifacts/capture-freeze-browser/
            artifacts/transitions-browser/

  playground-preview:
    name: playground-preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install --with-deps chromium
      - name: Verify packed editor and all54 native examples
        env:
          NODE_OPTIONS: --max-old-space-size=1536
        run: node --test --test-concurrency=1 tests/site.test.mjs
      - name: Verify full playground gate reached its final assertions
        env:
          EXPECTED_HEAD: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readdirSync, readFileSync } from 'node:fs';
          const paths = readdirSync('artifacts/playground');
          assert.equal(paths.length, 1);
          const result = JSON.parse(readFileSync(`artifacts/playground/${paths[0]}/manifest.json`, 'utf8'));
          assert.equal(result.sourceCommit, process.env.EXPECTED_HEAD);
          assert.equal(result.sourceDirty, false);
          assert.equal(result.scope, 'all-examples');
          assert.equal(result.failure, undefined);
          assert.equal(result.completed, true);
          assert.equal(new Set(result.rows.map(row => row.id)).size, 54);
          console.log('Exact-head editor/lifecycle and all54 native examples completed.');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-preview-${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: artifacts/playground/
